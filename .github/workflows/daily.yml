name: Kuro kainų scrape

# ENA paskelbia dienos (10 val.) kainas tik po 10 val. LT, todėl:
#  - rytinis paleidimas (~7:47 LT) garantuoja, kad iki 8 val. puslapyje yra
#    naujausia paskelbta (praėjusios darbo dienos) informacija, net jei
#    vakarykščiai paleidimai vėlavo ar nepavyko;
#  - dieniniai paleidimai paima šios dienos kainas, kai tik ENA jas paskelbia.
# Laikas UTC. LT vasarą = UTC+3, žiemą (nuo 10-25) = UTC+2.
# Minutės ne :00/:05, nes valandų pradžioje GitHub labiausiai vėlina paleidimus.
on:
  schedule:
    - cron: '47 4 * * 2-6'    # ~07:47 LT vasarą / 06:47 žiemą (an.–šešt.)
    - cron: '17 9 * * 1-5'    # ~12:17 / 11:17 LT
    - cron: '43 11 * * 1-5'   # ~14:43 / 13:43 LT
    - cron: '13 14 * * 1-5'   # ~17:13 / 16:13 LT (pakartojimas, jei ENA vėlavo)
  workflow_dispatch:          # rankinis paleidimas mygtuku

permissions:
  contents: write             # leisti commit'inti data.json

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps
        run: npm install xlsx --no-save

      - name: Run scraper
        run: node scrape.mjs

      - name: Degalinių koordinatės (tik naujos)
        run: node geocode.mjs
        continue-on-error: true     # koordinačių klaida nestabdo kainų atnaujinimo

      - name: Brent naftos kaina (FRED/EIA + ECB kursas)
        run: node brent.mjs
        continue-on-error: true

      - name: Commit jei pasikeitė
        run: |
          git config user.name  "kuro-bot"
          git config user.email "actions@github.com"
          for f in data.json geo.json brent.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --staged --quiet; then
            echo "Nieko naujo."
          else
            git commit -m "Atnaujinta: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main   # jei tuo metu kas nors įkėlė pakeitimų
            git push
          fi
